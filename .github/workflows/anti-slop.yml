name: Anti-Slop & Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]
  pull_request_target:
    types: [opened, reopened]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  # ==========================================================
  # LAPIS 1 — PR SCOPE & METADATA GATE (language-agnostic, tidak
  # perlu diubah apapun jenis project-nya)
  #
  # Nangkep PR yang nembak terlalu banyak file/baris untuk masalah
  # kecil, PR tanpa deskripsi/issue terkait, atau sinyal akun/commit
  # mencurigakan. Kasih label "redesign" untuk perubahan lintas-file
  # yang memang disengaja.
  # ==========================================================
  pr-scope-gate:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Cek skala PR (fokus vs. bukan)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'redesign') }}
        uses: peakoss/anti-slop@v0
        with:
          max-failures: 3
          max-changed-files: 15
          max-changed-lines: 400
          require-description: true
          max-description-length: 2500
          require-linked-issue: true
          max-emoji-count: 2
          max-code-references: 5
          require-conventional-commits: true
          require-commit-author-match: true
          min-account-age: 14
          detect-spam-usernames: true
          blocked-paths: |
            README.md
            SECURITY.md
            LICENSE
            CODE_OF_CONDUCT.md
            .github/workflows/
          exempt-author-association: "OWNER,MEMBER,COLLABORATOR"
          exempt-label: "exempt"
          failure-add-pr-labels: "needs-scope-review"
          failure-pr-message: |
            PR ini kelihatannya mengubah lebih banyak file/baris dari yang
            dibutuhkan untuk masalah yang dijelaskan, atau belum tertaut ke
            issue. Pecah jadi PR yang lebih fokus, atau beri label
            `redesign` kalau ini memang perubahan desain yang disengaja.
          close-pr: false

      - name: Redesign terdeteksi — cek lebih longgar
        if: ${{ contains(github.event.pull_request.labels.*.name, 'redesign') }}
        uses: peakoss/anti-slop@v0
        with:
          max-failures: 5
          max-changed-files: 0
          max-changed-lines: 0
          require-description: true
          require-linked-issue: true
          close-pr: false

  # ==========================================================
  # DETEKSI STACK — cukup lihat file penanda di root repo.
  # Ini yang bikin workflow ini "universal": copas ke project
  # apapun, step yang tidak relevan otomatis di-skip, bukan fail.
  # ==========================================================
  detect-stack:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      is_node: ${{ steps.detect.outputs.is_node }}
      is_gradle: ${{ steps.detect.outputs.is_gradle }}
      is_python: ${{ steps.detect.outputs.is_python }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          [ -f package.json ] && echo "is_node=true" >> "$GITHUB_OUTPUT" || echo "is_node=false" >> "$GITHUB_OUTPUT"
          if [ -f build.gradle.kts ] || [ -f build.gradle ] || [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "is_gradle=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_gradle=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            echo "is_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_python=false" >> "$GITHUB_OUTPUT"
          fi

  # ==========================================================
  # LAPIS 2 — DETEKSI POLA AI-SLOP DI KODE
  # Step per-stack, otomatis skip kalau file penanda stack itu
  # tidak ada. Tidak akan fail cuma karena "npm ci" gak ketemu
  # package.json di project Kotlin, misalnya.
  # ==========================================================
  code-quality-scan:
    needs: detect-stack
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Duplikasi/copy-paste kode: jalan untuk semua stack ---
      # jscpd punya tokenizer untuk banyak bahasa (JS/TS/Kotlin/Java/
      # Python/dll), jadi tidak perlu Node project untuk memakainya.
      - name: Setup Node (untuk jscpd)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cek duplikasi kode
        run: npx jscpd@latest . --threshold 5 --reporters console,github-actions --ignore "**/node_modules/**,**/build/**,**/dist/**,**/.gradle/**"

      # ---------- STACK: Node / JS / TS ----------
      - name: "[Node] Install dependencies"
        if: needs.detect-stack.outputs.is_node == 'true'
        run: npm ci

      - name: "[Node] Scan pola AI-slop (aislop)"
        if: needs.detect-stack.outputs.is_node == 'true'
        uses: scanaislop/aislop@v1
        with:
          version: latest
          args: ci --changes --base origin/${{ github.base_ref }}

      - name: "[Node] Lint ketat"
        if: needs.detect-stack.outputs.is_node == 'true'
        run: npm run lint -- --max-warnings=0

      - name: "[Node] Test + coverage"
        if: needs.detect-stack.outputs.is_node == 'true'
        run: npm test -- --coverage --coverageThreshold='{"global":{"lines":80,"branches":70}}'

      # ---------- STACK: Gradle / Kotlin / Java (Android) ----------
      # aislop belum punya rule untuk Kotlin, jadi untuk stack ini
      # kita pakai Detekt (setara "aislop"-nya dunia Kotlin: nangkep
      # exception generic yang ditelan, fungsi kepanjangan, kompleksitas
      # tinggi, dead code) + Kover untuk coverage.
      - name: "[Gradle] Setup JDK"
        if: needs.detect-stack.outputs.is_gradle == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "[Gradle] Cache Gradle"
        if: needs.detect-stack.outputs.is_gradle == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: "[Gradle] Static analysis (Detekt)"
        if: needs.detect-stack.outputs.is_gradle == 'true'
        run: ./gradlew detekt --continue

      - name: "[Gradle] Unit test + coverage (Kover)"
        if: needs.detect-stack.outputs.is_gradle == 'true'
        run: ./gradlew testDebugUnitTest koverVerify

      # ---------- STACK: Python ----------
      - name: "[Python] Setup Python"
        if: needs.detect-stack.outputs.is_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "[Python] Install dependencies"
        if: needs.detect-stack.outputs.is_python == 'true'
        run: pip install -r requirements.txt || pip install .

      - name: "[Python] Scan pola AI-slop (aislop)"
        if: needs.detect-stack.outputs.is_python == 'true'
        uses: scanaislop/aislop@v1
        with:
          version: latest
          args: ci --changes --base origin/${{ github.base_ref }}

      - name: "[Python] Lint (ruff)"
        if: needs.detect-stack.outputs.is_python == 'true'
        run: pip install ruff && ruff check .

      - name: "[Python] Test + coverage"
        if: needs.detect-stack.outputs.is_python == 'true'
        run: pip install pytest pytest-cov && pytest --cov --cov-fail-under=80

  # ==========================================================
  # GATE AKHIR — satu-satunya status check yang perlu diwajibkan
  # di Branch Protection, biar konsisten walau ada job yang skip.
  # ==========================================================
  quality-gate:
    if: always()
    needs: [code-quality-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Pastikan semua pengecekan lolos
        run: |
          if [ "${{ needs.code-quality-scan.result }}" != "success" ]; then
            echo "Quality gate gagal."
            exit 1
          fi
          echo "Quality gate lolos."