ci:
  failBelow: 70

exclude:
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/__generated__/**"
  - "dist/**"
  - "build/**"
  - "node_modules/**"

rules:
  ai-slop/narrative-comment: warning
  ai-slop/hidden-fallback: error
  ai-slop/dead-code: error
  ai-slop/unsafe-cast: error
  ai-slop/duplicated-helper: warning